<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS - Panel de Administración</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <div style="max-width: 500px; margin: 20px auto; padding: 0 10px;">
        <a href="index.html" style="color: #007bff; text-decoration: none; font-weight: bold;">← Volver a la Tienda</a>
    </div>

    <div id="seccion-cms" style="background: #222; padding: 20px; border-radius: 8px; margin: 20px auto; max-width: 500px; color: white;">
        <h2>CMS - Panel de Administración</h2>
        <form id="formulario-producto">
            <div style="margin-bottom: 10px;">
                <label>Título del producto:</label><br>
                <input type="text" id="cms-titulo" required style="width: 100%; padding: 8px;">
            </div>
            <div style="margin-bottom: 10px;">
                <label>Descripción:</label><br>
                <textarea id="cms-descripcion" required style="width: 100%; padding: 8px;"></textarea>
            </div>
            <div style="margin-bottom: 10px;">
                <label>Precio ($):</label><br>
                <input type="number" id="cms-precio" required style="width: 100%; padding: 8px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label>Stock inicial:</label><br>
                <input type="number" id="cms-stock" required style="width: 100%; padding: 8px;">
            </div>
            <button type="submit" style="background: #28a745; color: white; border: none; padding: 10px 15px; cursor: pointer; width: 100%;">
                Guardar Producto en el Servidor
            </button>
        </form>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
